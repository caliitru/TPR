services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tpr_dev
      POSTGRES_PASSWORD: tpr_dev_fixture_only
      POSTGRES_DB: tpr_ingestion_dev
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - tpr_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tpr_dev -d tpr_ingestion_dev']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  tpr_pg:
